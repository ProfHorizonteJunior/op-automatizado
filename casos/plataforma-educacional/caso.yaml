nome: plataforma-educacional
titulo: Plataforma educacional com agente IA e sistema de chamados colaborativos

product:
  descricao: >
    SaaS educacional B2B voltado para instituições de ensino técnico e superior.
    Professores configuram o conteúdo por unidade curricular; alunos aprendem
    com um agente IA que guia o PDI sem entregar respostas prontas. Um sistema
    de chamados peer-to-peer incentivado por moedas digitais complementa o ciclo
    de aprendizagem colaborativa.
  usuarios_alvo:
    - Estudantes de cursos técnicos e superiores de tecnologia
    - Professores e coordenadores pedagógicos
  problema_core: >
    Estudantes travam em exercícios e não recebem orientação personalizada a tempo;
    professores não têm visibilidade sobre o progresso real de cada aluno.
  proposta_de_valor:
    - Agente IA que conhece o plano de aula e orienta sem dar o código pronto
    - PDI automatizado por aluno baseado no histórico de interações
    - Chamados colaborativos com incentivo gamificado (moedas) validados pelo professor
    - Painel administrativo com visibilidade total do engajamento e progresso

tech:
  frontend:
    framework: Next.js 14 (App Router)
    linguagem: TypeScript
    ui: Tailwind CSS + shadcn/ui
    estado: Zustand
    justificativa: >
      SSR nativo para páginas públicas, rotas de API integradas e boa DX para
      wizard multi-step. shadcn/ui acelera prototipagem sem lock-in de design system.

  backend:
    runtime: Node.js 20 (AWS Lambda)
    linguagem: TypeScript
    framework: Fastify (lambdas via adapter) ou AWS Lambda direto
    orm: Drizzle ORM
    justificativa: >
      Lambdas mantêm custo proporcional ao uso real; Drizzle gera queries tipadas
      sem overhead de ORM pesado.

  agente_ia:
    orquestrador: LangChain.js (ou Amazon Bedrock Agents)
    llm: Amazon Bedrock (Claude 3 Sonnet / Haiku)
    rag: Amazon OpenSearch Serverless (vetor) + PDFs indexados via LangChain
    guardrail: Amazon Bedrock Guardrails (bloco de geração de código)
    justificativa: >
      Bedrock mantém os dados dentro da AWS; Guardrails nativos eliminam a necessidade
      de lógica manual de bloqueio; OpenSearch Serverless escala sem gestão de cluster.

  banco_de_dados:
    principal: Amazon RDS for PostgreSQL (Multi-AZ para produção)
    migrações: Drizzle Kit
    justificativa: >
      PostgreSQL suporta JSONB para histórico de chat flexível e tem suporte nativo
      a row-level security útil para isolamento por turma.

  armazenamento:
    pdfs: Amazon S3 (upload via presigned URL)
    icones_estaticos: Amazon S3 + CloudFront

  autenticacao:
    servico: Amazon Cognito (User Pools)
    fluxo: JWT (access token + refresh token)
    perfis:
      - estudante
      - professor

  agendador:
    servico: Amazon EventBridge Scheduler
    job: Verifica chamados com expiração de 4h e devolve à fila (cron a cada 15 min)

  infraestrutura:
    iac: AWS CDK (TypeScript)
    ci_cd: GitHub Actions
    ambiente_dev: LocalStack (emulação local de S3, SQS, Cognito)

structure:
  raiz:
    - README.md
    - package.json          # monorepo com workspaces
    - turbo.json            # Turborepo para build incremental
    - .github/
  apps:
    - apps/web/             # Next.js 14 — frontend
    - apps/api/             # Fastify + Lambda handlers
  packages:
    - packages/db/          # schema Drizzle + migrações
    - packages/ai/          # cliente Bedrock + RAG + guardrail
    - packages/auth/        # helpers Cognito JWT
    - packages/ui/          # componentes shadcn/ui compartilhados
  infra:
    - infra/                # AWS CDK stacks
  docs:
    - docs/                 # ADRs e guias visuais

problema: >
  Professores precisam de uma ferramenta onde possam definir o conteúdo das aulas
  por unidade curricular (UC), e os alunos possam interagir com um agente de IA que
  conhece o plano de aula, orienta o aprendizado em etapas individualizadas e não
  entrega código pronto. Além disso, a plataforma precisa de um sistema de chamados
  colaborativo onde alunos ajudam uns aos outros, recompensados com moedas digitais
  validadas pelo professor. O professor deve ter visibilidade total sobre o progresso,
  as dúvidas e o engajamento de cada aluno por turma.

atores:
  - nome: Estudante
    descricao: >
      Faz cadastro, escolhe uma turma, usa o chat com o agente IA, abre e responde
      chamados de dúvidas, visualiza anotações do professor e acompanha seu saldo de moedas.

  - nome: Professor (Admin)
    descricao: >
      Cria e gerencia turmas, unidades curriculares e PDFs de contexto para o agente.
      Valida chamados resolvidos, distribui moedas, monitora o progresso e engajamento
      de cada aluno e gerencia o bloco de anotações compartilhadas.

requisitos:
  autenticacao:
    - Cadastro de estudante com e-mail e senha
    - Login de estudante e professor com sessão autenticada
    - Estudante escolhe a turma após o login (turmas criadas pelo professor)
    - Professor pode mover estudantes entre turmas e renomear turmas

  agente_ia:
    - O professor anexa PDFs por UC; o agente usa esses PDFs como contexto
    - Guardrail ativo: o agente não pode gerar código pronto para o aluno
    - O agente conhece o PDI do aluno (o que já aprendeu vs. o que deve aprender)
    - O agente orienta o próximo passo de aprendizagem de forma personalizada
    - O histórico de interações do aluno com o agente é salvo no banco de dados

  chamados:
    - Aluno cria um chamado vinculado à sua turma e a uma UC
    - Chamado fica visível para todos os alunos da turma
    - Cada aluno pode assumir apenas um chamado por vez
    - O chamado fica vinculado ao aluno por no máximo 4 horas; após isso volta à fila
    - O aluno que assumiu pode desistir, devolvendo o chamado à fila
    - O aluno que teve a dúvida confirma se foi resolvido
    - O professor valida no painel; validando, o aluno ajudante recebe uma moeda
    - O professor pode negar a validação (chamado volta à fila) ou excluir o chamado
    - Cronômetro regressivo de 4h visível para o aluno que assumiu o chamado

  moedas:
    - Saldo de moedas visível para o aluno na área principal
    - Professor visualiza o saldo de cada aluno no painel administrativo
    - Moedas são concedidas apenas após validação do professor

  anotacoes:
    - Professor cria e edita blocos de anotações por turma/UC (código, links, exemplos)
    - Estudantes visualizam as anotações em modo somente leitura

  admin:
    - Dashboard com visão geral de todas as turmas
    - Gestão de turmas: criar, renomear, mover alunos entre turmas
    - Gestão de UCs: criar e associar PDFs de contexto ao agente
    - Fila de chamados pendentes de validação com opção de validar, negar ou excluir
    - Histórico de chamados por aluno com contador de chamados abertos
    - Saldo de moedas de cada aluno

paginas:
  - id: login-cadastro
    nome: Login e Cadastro
    descricao: Tela inicial para criação de conta e autenticação de estudantes e professor.

  - id: escolha-turma
    nome: Escolha de Turma
    descricao: >
      Após o login, o estudante escolhe uma das turmas disponíveis criadas pelo professor.
      Exibida apenas se o aluno ainda não estiver vinculado a uma turma ativa.

  - id: area-estudante
    nome: Área do Estudante (Wizard)
    descricao: >
      Interface principal do aluno em formato wizard com as seções:
      Chat com agente IA, Chamados (lista, assumir, criar) e Moedas.
    secoes:
      - chat: Conversa com o agente IA orientado pelo plano de aula da UC ativa
      - chamados-lista: Lista de chamados em aberto da turma, com botão de assumir
      - chamados-criar: Formulário para abrir um novo chamado vinculado a uma UC
      - chamado-ativo: Tela do chamado assumido com cronômetro regressivo de 4h
      - moedas: Exibição do saldo atual de moedas do aluno

  - id: anotacoes
    nome: Anotações do Professor
    descricao: >
      Repositório somente leitura para os alunos com blocos de código, links e
      exemplos publicados pelo professor por turma e UC.

  - id: admin
    nome: Painel Administrativo
    descricao: >
      Área exclusiva do professor com gestão completa: turmas, alunos, UCs, PDFs
      de contexto do agente, fila de validação de chamados, moedas e anotações.
    secoes:
      - dashboard: Visão geral de turmas, alunos ativos e chamados pendentes
      - turmas: Criar, renomear turmas e mover alunos
      - ucs: Criar unidades curriculares e anexar PDFs ao agente
      - chamados-validacao: Fila de chamados aguardando validação do professor
      - alunos: Progresso individual, contador de chamados, saldo de moedas
      - anotacoes-admin: Criar e editar blocos de anotações por turma/UC
